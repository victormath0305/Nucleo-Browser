<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoritos — Núcleo</title>
  <link rel="stylesheet" href="styles/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Nav */
    .manager-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 0 8px var(--accent-cyan-glow));
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-title {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-left: 4px;
    }

    /* Search */
    .search-box {
      flex: 1;
      max-width: 480px;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      gap: 8px;
      transition: all var(--trans-fast);
    }

    .search-box:focus-within {
      background: var(--bg-input-focus);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-cyan-subtle);
    }

    .search-box svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }

    /* Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--trans-fast);
    }

    .btn-action:hover {
      background: rgba(0, 229, 255, 0.12);
      border-color: var(--accent-cyan);
      color: #ffffff;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.25), rgba(0, 112, 243, 0.25));
      border-color: rgba(0, 229, 255, 0.5);
    }

    /* Layout Content */
    .content-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .folder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--trans-fast);
    }

    .folder-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .folder-item.active {
      background: rgba(0, 229, 255, 0.14);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .folder-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .folder-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .folder-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* Main List */
    .main-view {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .view-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bookmarks-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bookmark-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      transition: all var(--trans-fast);
    }

    .bookmark-card:hover {
      background: var(--bg-tertiary);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .bm-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .bm-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bm-icon img {
      width: 18px;
      height: 18px;
      border-radius: 3px;
    }

    .bm-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .bm-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bm-url {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bm-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--trans-fast);
    }

    .btn-icon:hover {
      background: var(--bg-hover);
      color: var(--accent-cyan);
    }

    .btn-icon.danger:hover {
      background: rgba(255, 71, 87, 0.15);
      color: var(--status-danger);
    }

    .btn-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
      color: var(--text-muted);
      gap: 12px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: var(--text-disabled);
      stroke-width: 1.5;
      fill: none;
    }

    /* Modal Dialog */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 420px;
      background: #121826;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .form-input, .form-select {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-cyan);
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="manager-header">
    <div class="brand-section" id="btnBackHome">
      <img src="../assets/icons/icon-32.png" alt="Logo" class="brand-logo">
      <span class="brand-title">Núcleo</span>
      <span class="page-title">/ Favoritos</span>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar favoritos..." autocomplete="off">
    </div>

    <div class="header-actions">
      <button class="btn-action" id="btnNewFolder">+ Nova Pasta</button>
      <button class="btn-action btn-primary" id="btnNewBookmark">+ Adicionar Favorito</button>
    </div>
  </header>

  <div class="content-body">
    <!-- Sidebar -->
    <aside class="sidebar" id="foldersSidebar">
      <!-- Dynamic Folders -->
    </aside>

    <!-- Main List Area -->
    <main class="main-view">
      <div class="view-title">
        <span id="currentFolderTitle">Todos os Favoritos</span>
      </div>
      <div class="bookmarks-list" id="bookmarksContainer">
        <!-- Dynamic Bookmarks Cards -->
      </div>
    </main>
  </div>

  <!-- Add/Edit Bookmark Modal -->
  <div class="modal-overlay" id="bookmarkModal">
    <div class="modal-box">
      <h3 class="modal-title" id="bmModalTitle">Adicionar Favorito</h3>
      <input type="hidden" id="bmEditId">
      <div class="form-group">
        <label class="form-label" for="bmTitleInput">Nome</label>
        <input type="text" id="bmTitleInput" class="form-input" placeholder="Nome do favorito">
      </div>
      <div class="form-group">
        <label class="form-label" for="bmUrlInput">URL</label>
        <input type="text" id="bmUrlInput" class="form-input" placeholder="https://exemplo.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="bmFolderSelect">Pasta</label>
        <select id="bmFolderSelect" class="form-select"></select>
      </div>
      <div class="modal-buttons">
        <button class="btn-action" id="bmModalCancel">Cancelar</button>
        <button class="btn-action btn-primary" id="bmModalSave">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Add Folder Modal -->
  <div class="modal-overlay" id="folderModal">
    <div class="modal-box">
      <h3 class="modal-title">Nova Pasta</h3>
      <div class="form-group">
        <label class="form-label" for="folderNameInput">Nome da Pasta</label>
        <input type="text" id="folderNameInput" class="form-input" placeholder="Minha Pasta">
      </div>
      <div class="modal-buttons">
        <button class="btn-action" id="folderModalCancel">Cancelar</button>
        <button class="btn-action btn-primary" id="folderModalSave">Criar</button>
      </div>
    </div>
  </div>

  <script>
    const api = window.nucleoAPI;

    let allBookmarks = [];
    let allFolders = [];
    let currentFolderId = 'all';

    const foldersSidebar = document.getElementById('foldersSidebar');
    const bookmarksContainer = document.getElementById('bookmarksContainer');
    const currentFolderTitle = document.getElementById('currentFolderTitle');
    const searchInput = document.getElementById('searchInput');

    // Modals
    const bookmarkModal = document.getElementById('bookmarkModal');
    const bmModalTitle = document.getElementById('bmModalTitle');
    const bmEditId = document.getElementById('bmEditId');
    const bmTitleInput = document.getElementById('bmTitleInput');
    const bmUrlInput = document.getElementById('bmUrlInput');
    const bmFolderSelect = document.getElementById('bmFolderSelect');
    const bmModalCancel = document.getElementById('bmModalCancel');
    const bmModalSave = document.getElementById('bmModalSave');

    const folderModal = document.getElementById('folderModal');
    const folderNameInput = document.getElementById('folderNameInput');
    const folderModalCancel = document.getElementById('folderModalCancel');
    const folderModalSave = document.getElementById('folderModalSave');

    async function loadData() {
      if (!api?.bookmarks) return;
      allBookmarks = await api.bookmarks.getAll();
      allFolders = await api.bookmarks.getFolders();
      renderFolders();
      renderBookmarks();
    }

    function renderFolders() {
      foldersSidebar.innerHTML = `
        <div class="folder-item${currentFolderId === 'all' ? ' active' : ''}" data-id="all">
          <div class="folder-item-left">
            <svg class="folder-icon" viewBox="0 0 16 16"><path d="M 2 3 L 6 3 L 8 5 L 14 5 A 1 1 0 0 1 15 6 L 15 13 A 1 1 0 0 1 14 14 L 2 14 A 1 1 0 0 1 1 13 L 1 4 A 1 1 0 0 1 2 3 Z"/></svg>
            <span class="folder-name">Todos os Favoritos</span>
          </div>
          <span class="folder-badge">${allBookmarks.length}</span>
        </div>
      `;

      allFolders.forEach(f => {
        if (f.id === 'root') return;
        const count = allBookmarks.filter(b => b.folderId === f.id).length;
        const item = document.createElement('div');
        item.className = `folder-item${currentFolderId === f.id ? ' active' : ''}`;
        item.setAttribute('data-id', f.id);
        item.innerHTML = `
          <div class="folder-item-left">
            <svg class="folder-icon" viewBox="0 0 16 16"><path d="M 2 3 L 6 3 L 8 5 L 14 5 A 1 1 0 0 1 15 6 L 15 13 A 1 1 0 0 1 14 14 L 2 14 A 1 1 0 0 1 1 13 L 1 4 A 1 1 0 0 1 2 3 Z"/></svg>
            <span class="folder-name">${f.title}</span>
          </div>
          <span class="folder-badge">${count}</span>
        `;
        item.addEventListener('click', () => {
          currentFolderId = f.id;
          currentFolderTitle.textContent = f.title;
          renderFolders();
          renderBookmarks();
        });
        foldersSidebar.appendChild(item);
      });

      foldersSidebar.firstElementChild.addEventListener('click', () => {
        currentFolderId = 'all';
        currentFolderTitle.textContent = 'Todos os Favoritos';
        renderFolders();
        renderBookmarks();
      });
    }

    function renderBookmarks() {
      const q = searchInput.value.toLowerCase().trim();
      let filtered = allBookmarks;

      if (q) {
        filtered = filtered.filter(b => b.title.toLowerCase().includes(q) || b.url.toLowerCase().includes(q));
      } else if (currentFolderId !== 'all') {
        filtered = filtered.filter(b => b.folderId === currentFolderId);
      }

      bookmarksContainer.innerHTML = '';

      if (filtered.length === 0) {
        bookmarksContainer.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M 12 2 L 15.09 8.26 L 22 9.27 L 17 14.14 L 18.18 21.02 L 12 17.77 L 5.82 21.02 L 7 14.14 L 2 9.27 L 8.91 8.26 Z"/></svg>
            <span>Nenhum favorito encontrado</span>
          </div>
        `;
        return;
      }

      filtered.forEach(b => {
        const card = document.createElement('div');
        card.className = 'bookmark-card';
        card.innerHTML = `
          <div class="bm-info">
            <div class="bm-icon">
              ${b.favicon ? `<img src="${b.favicon}" alt="" onerror="this.parentElement.innerHTML='★'">` : '★'}
            </div>
            <div class="bm-text">
              <span class="bm-title">${b.title}</span>
              <span class="bm-url">${b.url}</span>
            </div>
          </div>
          <div class="bm-actions">
            <button class="btn-icon" title="Abrir em nova aba" data-action="open">
              <svg viewBox="0 0 16 16"><path d="M 9 2 L 14 2 L 14 7 M 6 10 L 14 2 M 13 9 L 13 13 A 1 1 0 0 1 12 14 L 3 14 A 1 1 0 0 1 2 13 L 2 4 A 1 1 0 0 1 3 3 L 7 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button class="btn-icon" title="Editar" data-action="edit">
              <svg viewBox="0 0 16 16"><path d="M 12.146.854a.5.5 0 0 1 .708 0l2.292 2.292a.5.5 0 0 1 0 .708l-9.5 9.5a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l9.5-9.5z"/></svg>
            </button>
            <button class="btn-icon danger" title="Excluir" data-action="delete">
              <svg viewBox="0 0 16 16"><path d="M 5.5 5.5 L 5.5 11.5 M 10.5 5.5 L 10.5 11.5 M 2.5 3.5 L 13.5 3.5 M 6.5 1.5 L 9.5 1.5 L 10.5 3.5 L 5.5 3.5 Z M 3.5 3.5 L 3.5 13.5 A 1 1 0 0 0 4.5 14.5 L 11.5 14.5 A 1 1 0 0 0 12.5 13.5 L 12.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
        `;

        card.querySelector('.bm-info').addEventListener('click', () => {
          if (api?.navigate) {
            api.navigate(b.url);
          } else {
            window.location.href = b.url;
          }
        });

        card.querySelector('[data-action="open"]').addEventListener('click', (e) => {
          e.stopPropagation();
          api.createTab(b.url);
        });

        card.querySelector('[data-action="edit"]').addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(b);
        });

        card.querySelector('[data-action="delete"]').addEventListener('click', async (e) => {
          e.stopPropagation();
          if (confirm(`Remover o favorito "${b.title}"?`)) {
            await api.bookmarks.remove(b.id);
            await loadData();
          }
        });

        bookmarksContainer.appendChild(card);
      });
    }

    function populateFolderSelect(selectedId = 'toolbar') {
      bmFolderSelect.innerHTML = '';
      allFolders.forEach(f => {
        if (f.id === 'root') return;
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = f.title;
        if (f.id === selectedId) opt.selected = true;
        bmFolderSelect.appendChild(opt);
      });
    }

    function openEditModal(b = null) {
      if (b) {
        bmModalTitle.textContent = 'Editar Favorito';
        bmEditId.value = b.id;
        bmTitleInput.value = b.title;
        bmUrlInput.value = b.url;
        populateFolderSelect(b.folderId);
      } else {
        bmModalTitle.textContent = 'Adicionar Favorito';
        bmEditId.value = '';
        bmTitleInput.value = '';
        bmUrlInput.value = '';
        populateFolderSelect(currentFolderId === 'all' ? 'toolbar' : currentFolderId);
      }
      bookmarkModal.classList.add('open');
      bmTitleInput.focus();
    }

    // Modal Events
    document.getElementById('btnNewBookmark').addEventListener('click', () => openEditModal());
    bmModalCancel.addEventListener('click', () => bookmarkModal.classList.remove('open'));

    bmModalSave.addEventListener('click', async () => {
      const title = bmTitleInput.value.trim();
      const url = bmUrlInput.value.trim();
      const folderId = bmFolderSelect.value;
      const editId = bmEditId.value;

      if (!url) return alert('Por favor, informe a URL');

      if (editId) {
        await api.bookmarks.update(editId, { title, url, folderId });
      } else {
        await api.bookmarks.add({ title, url, folderId });
      }
      bookmarkModal.classList.remove('open');
      await loadData();
    });

    document.getElementById('btnNewFolder').addEventListener('click', () => {
      folderNameInput.value = '';
      folderModal.classList.add('open');
      folderNameInput.focus();
    });

    folderModalCancel.addEventListener('click', () => folderModal.classList.remove('open'));

    folderModalSave.addEventListener('click', async () => {
      const name = folderNameInput.value.trim();
      if (!name) return;
      await api.bookmarks.createFolder({ title: name, parentId: 'root' });
      folderModal.classList.remove('open');
      await loadData();
    });

    searchInput.addEventListener('input', () => renderBookmarks());

    // Listen to updates from other windows/tabs
    if (api?.bookmarks?.onUpdated) {
      api.bookmarks.onUpdated(() => loadData());
    }

    document.getElementById('btnBackHome')?.addEventListener('click', () => {
      window.location.href = 'nucleo://newtab';
    });

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
