<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Aba — Núcleo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0d14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Ambient background glow */
    .glow-aura {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.12) 0%, rgba(121, 40, 202, 0.06) 50%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      padding: 32px 24px;
      text-align: center;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.45));
      animation: gentlePulse 4s ease-in-out infinite alternate;
    }

    @keyframes gentlePulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.35)); }
      100% { transform: scale(1.04); filter: drop-shadow(0 0 26px rgba(0, 229, 255, 0.6)); }
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00e5ff 0%, #0070f3 50%, #9d4edd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-size: 14.5px;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 30px;
    }

    /* Search Bar */
    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: #101522;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 14px 6px 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      transition: all 200ms ease;
    }

    .search-box:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: #141b2c;
    }

    .search-box:focus-within {
      background: #141b2c;
      border-color: #00e5ff;
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.2), 0 10px 32px rgba(0, 0, 0, 0.6);
    }

    .search-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #64748b;
      stroke-width: 2;
      margin-right: 12px;
      flex-shrink: 0;
      transition: stroke 150ms ease;
    }

    .search-box:focus-within .search-icon {
      stroke: #00e5ff;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: #f8fafc;
      font-family: inherit;
      caret-color: #00e5ff;
      user-select: text;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      transition: all 150ms ease;
    }

    .search-btn:hover {
      color: #00e5ff;
      background: rgba(255, 255, 255, 0.08);
    }

    .search-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Quick Access (Acesso Rápido) Section */
    .quick-access-section {
      width: 100%;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quick-access-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .quick-access-title {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .quick-access-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .quick-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      cursor: pointer;
      transition: all 180ms ease;
      text-decoration: none;
      color: inherit;
    }

    .quick-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(0, 229, 255, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .quick-card-icon {
      width: 38px;
      height: 38px;
      background: #141a29;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #00e5ff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .quick-card-icon img {
      width: 22px;
      height: 22px;
      border-radius: 3px;
    }

    .quick-card-title {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .quick-card.add-card {
      border-style: dashed;
      border-color: rgba(255, 255, 255, 0.12);
      opacity: 0.8;
    }

    .quick-card.add-card:hover {
      border-color: #00e5ff;
      border-style: solid;
      opacity: 1;
    }

    .quick-card.add-card .quick-card-icon {
      background: rgba(0, 229, 255, 0.08);
      color: #00e5ff;
    }

    .quick-card.add-card svg {
      width: 18px;
      height: 18px;
    }

    /* Quick Shortcuts Badge */
    .shortcuts-hint {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 36px;
      font-size: 12px;
      color: #475569;
    }

    .kbd-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    kbd {
      background: #141b2c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-family: 'Cascadia Code', Consolas, monospace;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="glow-aura"></div>

  <div class="container">
    <div class="logo-wrapper">
      <svg class="logo-img" viewBox="0 0 512 512">
        <circle cx="256" cy="256" r="140" fill="#00e5ff" opacity="0.3" filter="blur(20px)"/>
        <rect x="24" y="24" width="464" height="464" rx="104" fill="#101522" stroke="rgba(0, 229, 255, 0.4)" stroke-width="4"/>
        <g transform="rotate(-32 256 256)">
          <ellipse cx="256" cy="256" rx="180" ry="68" fill="none" stroke="#00e5ff" stroke-width="7" opacity="0.9"/>
          <circle cx="436" cy="256" r="9" fill="#00e5ff"/>
          <circle cx="436" cy="256" r="5" fill="#ffffff"/>
        </g>
        <g transform="rotate(38 256 256)">
          <ellipse cx="256" cy="256" rx="180" ry="68" fill="none" stroke="#9d4edd" stroke-width="7" opacity="0.9"/>
          <circle cx="256" cy="188" r="8" fill="#38bdf8"/>
          <circle cx="256" cy="188" r="4.5" fill="#ffffff"/>
        </g>
        <circle cx="256" cy="256" r="62" fill="#0070f3"/>
        <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.85"/>
        <circle cx="256" cy="256" r="14" fill="#ffffff"/>
      </svg>
    </div>

    <h1 class="brand-title">Núcleo</h1>
    <p class="brand-tagline">Seu espaço para navegar.</p>

    <form class="search-box" id="searchForm">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Pesquisar ou digitar endereço da web..." 
        autocomplete="off" 
        autofocus>
      <button type="submit" class="search-btn" title="Navegar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <!-- Quick Access Section -->
    <div class="quick-access-section">
      <div class="quick-access-header">
        <span class="quick-access-title">Acesso rápido</span>
      </div>
      <div class="quick-access-grid" id="quickAccessGrid">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <div class="shortcuts-hint">
      <span class="kbd-badge"><kbd>Ctrl</kbd> + <kbd>T</kbd> Nova aba</span>
      <span class="kbd-badge"><kbd>Ctrl</kbd> + <kbd>D</kbd> Favoritar</span>
      <span class="kbd-badge"><kbd>Ctrl</kbd> + <kbd>H</kbd> Histórico</span>
      <span class="kbd-badge"><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>B</kbd> Favoritos</span>
      <span class="kbd-badge"><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>E</kbd> Extensões</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');
    const grid = document.getElementById('quickAccessGrid');

    window.addEventListener('DOMContentLoaded', () => {
      input.focus();
      loadQuickAccess();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;

      if (/^(https?|ftp|file|nucleo):\/\//i.test(val)) {
        window.location.href = val;
      } else if (val === 'nucleo://bookmarks' || val === 'nucleo://favoritos') {
        window.location.href = 'nucleo://bookmarks';
      } else if (val === 'nucleo://history' || val === 'nucleo://historico') {
        window.location.href = 'nucleo://history';
      } else if (val === 'nucleo://shield' || val === 'nucleo://protecao') {
        window.location.href = 'nucleo://shield';
      } else if (val === 'nucleo://shield-test') {
        window.location.href = 'nucleo://shield-test';
      } else if (val === 'nucleo://extensions' || val === 'nucleo://extensoes') {
        window.location.href = 'nucleo://extensions';
      } else if (val === 'nucleo://extension-test') {
        window.location.href = 'nucleo://extension-test';
      } else if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}(:\d+)?(\/.*)?$/.test(val)) {
        window.location.href = 'https://' + val;
      } else if (/^localhost(:\d+)?(\/.*)?$/i.test(val)) {
        window.location.href = 'http://' + val;
      } else {
        window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(val);
      }
    });

    async function loadQuickAccess() {
      if (!grid) return;
      let items = [];

      try {
        if (window.nucleoAPI?.bookmarks?.getQuickAccess) {
          items = await window.nucleoAPI.bookmarks.getQuickAccess(8);
        }
      } catch (err) {
        console.warn('Could not fetch quick access from nucleoAPI:', err);
      }

      // Default fallback items if none found
      if (!items || items.length === 0) {
        items = [
          { title: 'GitHub', url: 'https://github.com' },
          { title: 'DuckDuckGo', url: 'https://duckduckgo.com' },
          { title: 'Google', url: 'https://www.google.com' },
          { title: 'YouTube', url: 'https://www.youtube.com' }
        ];
      }

      grid.innerHTML = '';

      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'quick-card';
        card.title = `${item.title}\n${item.url}`;

        const initial = (item.title || item.url || 'W').charAt(0).toUpperCase();
        card.innerHTML = `
          <div class="quick-card-icon">
            ${item.favicon ? `<img src="${item.favicon}" alt="" onerror="this.parentElement.textContent='${initial}'">` : `<span>${initial}</span>`}
          </div>
          <span class="quick-card-title">${item.title || item.url}</span>
        `;

        card.addEventListener('click', () => {
          if (window.nucleoAPI?.navigate) {
            window.nucleoAPI.navigate(item.url);
          } else {
            window.location.href = item.url;
          }
        });

        grid.appendChild(card);
      });

      // Add "+" Card for managing/adding favorites
      const addCard = document.createElement('div');
      addCard.className = 'quick-card add-card';
      addCard.title = 'Gerenciar Favoritos';
      addCard.innerHTML = `
        <div class="quick-card-icon">
          <svg viewBox="0 0 16 16"><path d="M 8 3 L 8 13 M 3 8 L 13 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="quick-card-title">Adicionar</span>
      `;

      addCard.addEventListener('click', () => {
        window.location.href = 'nucleo://bookmarks';
      });

      grid.appendChild(addCard);
    }

    if (window.nucleoAPI?.bookmarks?.onUpdated) {
      window.nucleoAPI.bookmarks.onUpdated(() => {
        loadQuickAccess();
      });
    }
  </script>
</body>
</html>
