<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Core Glow & Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f5ff"/>
      <stop offset="60%" stop-color="#0070f3"/>
      <stop offset="90%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="innerCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#80f7ff"/>
      <stop offset="70%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#5500dd"/>
    </radialGradient>

    <!-- Orbit Gradients -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Filters for Bloom and Neon Effect -->
    <filter id="coreBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36" result="glow"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" opacity="0.35" filter="url(#ambientGlow)"/>

  <!-- Icon Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Internal Grid / Tech Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.4"/>

  <!-- Orbit 1 (Tilted -35 deg) -->
  <g transform="rotate(-32 256 256)">
    <ellipse cx="256" cy="256" rx="180" ry="68" fill="none" stroke="url(#orbitGrad1)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <!-- Orbital Node 1 -->
    <circle cx="436" cy="256" r="9" fill="#00e5ff" filter="url(#coreBlur)"/>
    <circle cx="436" cy="256" r="5" fill="#ffffff"/>
    <!-- Orbital Node 2 (Opposite) -->
    <circle cx="76" cy="256" r="7" fill="#a855f7"/>
    <circle cx="76" cy="256" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Orbit 2 (Tilted +35 deg) -->
  <g transform="rotate(38 256 256)">
    <ellipse cx="256" cy="256" rx="180" ry="68" fill="none" stroke="url(#orbitGrad2)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <!-- Orbital Node 3 -->
    <circle cx="256" cy="188" r="8" fill="#38bdf8" filter="url(#coreBlur)"/>
    <circle cx="256" cy="188" r="4.5" fill="#ffffff"/>
    <!-- Orbital Node 4 -->
    <circle cx="256" cy="324" r="7.5" fill="#06b6d4"/>
    <circle cx="256" cy="324" r="4" fill="#ffffff"/>
  </g>

  <!-- Central Dynamic Energy Aura -->
  <circle cx="256" cy="256" r="86" fill="url(#coreGlow)" opacity="0.75" filter="url(#coreBlur)"/>

  <!-- The Nucleus Sphere -->
  <circle cx="256" cy="256" r="62" fill="url(#innerCore)"/>

  <!-- Geometric Crystal / Intelligent Focus Facets on Nucleus -->
  <path d="M 256 200 L 304 256 L 256 312 L 208 256 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.45"/>
  <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.85" filter="url(#coreBlur)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>

  <!-- Specular Reflection Highlight -->
  <ellipse cx="236" cy="226" rx="16" ry="9" transform="rotate(-30 236 226)" fill="#ffffff" opacity="0.7"/>
</svg>
